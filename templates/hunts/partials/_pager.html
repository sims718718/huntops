{% if is_paginated %}<nav class="pager" aria-label="Results pages">{% if page_obj.has_previous %}<a href="{% querystring page=page_obj.previous_page_number %}" hx-get="{% querystring page=page_obj.previous_page_number %}" hx-target="#results" hx-swap="outerHTML" hx-push-url="true">Previous</a>{% endif %}<span>Page {{ page_obj.number }} of {{ paginator.num_pages }}</span>{% if page_obj.has_next %}<a href="{% querystring page=page_obj.next_page_number %}" hx-get="{% querystring page=page_obj.next_page_number %}" hx-target="#results" hx-swap="outerHTML" hx-push-url="true">Next</a>{% endif %}</nav>{% endif %}
